type Query {
  # The signed-in user.
  getUser: User!
  """
  Users with a role.

  Sorted by name.
  """
  listUsers(
    "Only users with this role."
    role: Role!
    limit: Int
  ): [User!]!
}

type Mutation {
  createUser(
    """
    The new user.

    Name is required.
    """
    post: UserInput!
  ): User!
}

"""
A User
"""
type User {
  id: ID!
  name: String!
}

"""
Access level.
"""
enum Role {
  "Full access."
  ADMIN
  USER
}

# More roles.
extend enum Role {
  "Read only."
  GUEST
}

# Input for user
input UserInput {
  name: String!
}
