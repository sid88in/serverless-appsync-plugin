extend type Query {
  getPost(
    "This is an inline description"
    id: ID!
  ): Post!
}

extend type Mutation {
  """
  This is a description
  that includes multiple lines

  and a second paragraph
  """
  createPost(post: PostInput!): Post!
}

# This is a comment
type Post @aws_oidc {
  id: ID!
  title: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

"""
This is a description
"""
input PostInput {
  title: String!
}

enum PostStatus {
  "Visible to everyone."
  PUBLISHED
  DRAFT
}
