service: appsync-schema-s3

provider:
  name: aws
  runtime: nodejs22.x

plugins:
  - serverless-appsync-plugin

# The schema goes to the deployment bucket instead of the CloudFormation
# template, which keeps a large schema clear of the template size limit.

appSync:
  name: schema-s3
  schema: schema.graphql
  uploadSchemaToS3: true
  authentication:
    type: API_KEY
  apiKeys:
    - name: default

  resolvers:
    Query.getUser:
      kind: UNIT
      dataSource: none_ds

  dataSources:
    none_ds:
      type: NONE
